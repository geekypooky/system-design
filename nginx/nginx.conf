events {
    worker_connections 1024;
}

http {
    upstream api_backend {
        server api:8000;
    }

    server {
        listen 8080;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /v1/ {
            proxy_pass http://api_backend/v1/;
            proxy_set_header Host $host;
        }

        location /admin/ {
            proxy_pass http://api_backend/admin/;
            proxy_set_header Host $host;
        }
    }
}
